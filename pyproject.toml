[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fvtled-control"
version = "0.1.0"
description = "BLE controller for FVTLED ARZ-2100 RGB LED strips"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fvtled_control*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
